name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge,bioconda
          channel-priority: strict
          activate-environment: gta
      - name: Install bioinformatics tools
        run: conda install -y bcftools samtools bwa wgsim nextflow "openjdk>=17"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Generate test data
        run: make data
      - name: Tests
        run: pytest -q
      - name: Mock evaluation
        run: gta eval --mock
