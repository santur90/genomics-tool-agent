    path: pipelines/rnaseq_mini/main.nf
    description: Mini RNA-seq pipeline (FASTQC_STUB -> COUNT_STUB -> DESEQ2)
    allowed_params: [counts, metadata, factor, ref_level]
    path_params: [counts, metadata]
