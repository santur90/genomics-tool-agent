[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genomics-tool-agent"
dynamic = ["version"]
description = "LLM agent that calls genomics analysis tools via function calling, with a known-answer evaluation benchmark"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "santur90" }]
requires-python = ">=3.11"
keywords = ["llm", "agent", "tool-calling", "genomics", "bioinformatics", "rna-seq", "nextflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "openai>=1.30",
  "pydantic>=2",
  "typer>=0.12",
  "rich",
  "pandas",
  "numpy",
  "scipy",
  "pydeseq2",
  "pyyaml",
  "rank-bm25",
]

[project.urls]
Homepage = "https://github.com/santur90/genomics-tool-agent"
Repository = "https://github.com/santur90/genomics-tool-agent"
Issues = "https://github.com/santur90/genomics-tool-agent/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "build", "twine"]
rag = ["sentence-transformers"]

[project.scripts]
gta = "gta.cli:app"

[tool.setuptools.dynamic]
version = { attr = "gta.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gta = [
  "resources/*.yaml",
  "resources/*.md",
  "resources/pipelines/*/*.nf",
  "resources/pipelines/*/bin/*.py",
  "resources/pipelines/*/example/*.tsv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:The dispersion trend curve fitting did not converge:UserWarning"]

[tool.coverage.run]
source = ["src/gta"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data/variants", "runs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long prompt/description strings; ruff format handles code
