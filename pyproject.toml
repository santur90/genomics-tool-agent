[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genomics-tool-agent"
version = "0.1.0"
description = "LLM agent that calls genomics analysis tools, with an evaluation benchmark"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.30",
  "pydantic>=2",
  "typer>=0.12",
  "rich",
  "pandas",
  "numpy",
  "scipy",
  "pydeseq2",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gta = "gta.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
