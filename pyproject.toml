[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genomics-tool-agent"
version = "0.1.0"
description = "LLM agent that calls genomics analysis tools, with an evaluation benchmark"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.30",
  "pydantic>=2",
  "typer>=0.12",
  "rich",
  "pandas",
  "numpy",
  "scipy",
  "pydeseq2",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
gta = "gta.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:The dispersion trend curve fitting did not converge:UserWarning"]

[tool.coverage.run]
source = ["src/gta"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data/variants", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long prompt/description strings; ruff format handles code
